name: DroidPy CI / APK / Release

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: 執行 Python 測試
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安裝依賴與測試工具
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: 執行單元測試
        run: |
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pytest -v
          else
            echo "尚未偵測到測試檔案，先執行語法檢查"
            python -m compileall -q .
          fi

  build-apk:
    name: 打包 Android APK
    needs: test
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 JDK 17 與 Python
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 Android 打包工具依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer cython==0.29.36 virtualenv

      - name: 快取 Buildozer 下載與建置檔
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 建置 APK
        run: |
          if [ -f buildozer.spec ]; then
            buildozer android debug
          else
            echo "找不到 buildozer.spec，請確認打包工具設定"
            exit 1
          fi

      - name: 上傳 APK 建置產物
        uses: actions/upload-artifact@v4
        with:
          name: droidpy-apk-${{ github.run_number }}
          path: bin/*.apk

  release:
    name: 建立 GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載剛打包的 APK
        uses: actions/download-artifact@v4
        with:
          pattern: droidpy-apk-*
          merge-multiple: true
          path: release_assets

      - name: 發布 Release 並附加 APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.apk
          generate_release_notes: true
