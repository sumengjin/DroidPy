name: DroidPy CI / APK / Release

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "選填：手動發布 GitHub Release 標籤（例如 v1.2.1，留空則僅產出 APK Artifact）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: 測試與網頁建置
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 語法與單元測試
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pip install pytest
            pytest -v
          else
            echo "執行 Python 語法檢查"
            python -m compileall -q -x "node_modules|dist|android|.git" .
          fi

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝依賴並建置前端 PWA
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          npm run lint
          npm run build

      - name: 上傳離線前端建置產物
        uses: actions/upload-artifact@v4
        with:
          name: droidpy-web-dist
          path: dist/

  build-apk:
    name: 打包 Android APK (ARM64)
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載前端建置產物
        uses: actions/download-artifact@v4
        with:
          name: droidpy-web-dist
          path: dist

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 產生 Android Gradle 專案與離線資源
        run: |
          if [ ! -f "android/settings.gradle.kts" ]; then
            if [ -f "package-lock.json" ]; then
              npm ci || npm install --legacy-peer-deps --no-audit --no-fund
            else
              npm install --legacy-peer-deps --no-audit --no-fund
            fi
            npx tsx scripts/prepare-android.ts
          fi
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: 下載內嵌 Termux ARM64 Bootstrap
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL "https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip" \
            -o android/app/src/main/assets/bootstrap-aarch64.zip

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 設定 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 設定一致性 APK 簽名與遞增版號
        env:
          CUSTOM_KS_B64: ${{ secrets.DROIDPY_KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASS: ${{ secrets.DROIDPY_STORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.DROIDPY_KEY_ALIAS }}
          CUSTOM_KEY_PASS: ${{ secrets.DROIDPY_KEY_PASSWORD }}
        run: |
          VER=$(grep -m1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md 2>/dev/null | tr -d '[' || true)
          if [ -n "$VER" ]; then
            IFS='.' read -r MAJ MIN PAT <<< "$VER"
            VCODE=$(( ${MAJ:-1} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
            VNAME="$VER"
          else
            VCODE=$(( 10200 + ${GITHUB_RUN_NUMBER:-1} ))
            VNAME="1.2.${GITHUB_RUN_NUMBER:-1}"
          fi
          echo "DROIDPY_VERSION_CODE=${VCODE}" >> "$GITHUB_ENV"
          echo "DROIDPY_VERSION_NAME=${VNAME}" >> "$GITHUB_ENV"
          echo "Android versionCode=${VCODE}, versionName=${VNAME}"

          if [ -n "$CUSTOM_KS_B64" ]; then
            printf '%s' "$CUSTOM_KS_B64" | base64 -d > android/app/droidpy-custom.keystore
            echo "DROIDPY_KEYSTORE_FILE=droidpy-custom.keystore" >> "$GITHUB_ENV"
            printf 'DROIDPY_STORE_PASSWORD=%s\n' "$CUSTOM_STORE_PASS" >> "$GITHUB_ENV"
            printf 'DROIDPY_KEY_ALIAS=%s\n' "$CUSTOM_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'DROIDPY_KEY_PASSWORD=%s\n' "$CUSTOM_KEY_PASS" >> "$GITHUB_ENV"
            echo "使用 GitHub Secrets 自訂簽名金鑰 (droidpy-custom.keystore)"
          else
            if [ ! -f "android/app/droidpy-debug.p12" ] && [ -f "signing/droidpy-debug.p12" ]; then
              cp signing/droidpy-debug.p12 android/app/droidpy-debug.p12
            fi
            mkdir -p ~/.android
            cp android/app/droidpy-debug.p12 ~/.android/debug.keystore
            echo "DROIDPY_KEYSTORE_FILE=droidpy-debug.p12" >> "$GITHUB_ENV"
            echo "使用固定 DroidPy 一致性簽名金鑰 (SHA-256: 29:C5:49:F0:2A:B1:78:1D:...)"
          fi

      - name: 編譯 Debug APK (arm64-v8a)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 驗證 APK 簽名指紋
        run: |
          APK_PATH=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          else
            keytool -printcert -jarfile "$APK_PATH" || true
          fi

      - name: 解析發佈版本並整理 APK 檔名
        id: resolve_tag
        run: |
          mkdir -p release-apk
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            REL_TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REL_TAG="${GITHUB_REF_NAME}"
          else
            VER=$(grep -m1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md 2>/dev/null | tr -d '[]' || true)
            if [ -n "$VER" ]; then
              REL_TAG="v${VER#v}"
            else
              REL_TAG="v0.0.${GITHUB_RUN_NUMBER}"
            fi
          fi
          SAFE_TAG="${REL_TAG//\//-}"
          cp android/app/build/outputs/apk/debug/*.apk "release-apk/DroidPy-arm64-${SAFE_TAG}.apk"
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"

      - name: 上傳 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidPy-arm64-apk
          path: release-apk/*.apk

  release:
    name: 建立 GitHub Release
    needs: build-apk
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載 APK 建置產物
        uses: actions/download-artifact@v4
        with:
          name: DroidPy-arm64-apk
          path: release-apk

      - name: 發布 GitHub Release 並附加 APK
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ needs.build-apk.outputs.release_tag }}
        run: |
          APK_FILE=$(ls release-apk/*.apk | head -n1)
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$APK_FILE" --clobber
            if [ -f CHANGELOG.md ]; then
              gh release edit "$REL_TAG" --notes-file CHANGELOG.md
            fi
          else
            if [ -f CHANGELOG.md ]; then
              gh release create "$REL_TAG" "$APK_FILE" \
                --title "DroidPy ${REL_TAG}" \
                --notes-file CHANGELOG.md \
                --target "${GITHUB_SHA}"
            else
              gh release create "$REL_TAG" "$APK_FILE" \
                --title "DroidPy ${REL_TAG}" \
                --generate-notes \
                --target "${GITHUB_SHA}"
            fi
          fi
