name: DroidPy CI / APK / Release

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "選填：手動發布 GitHub Release 標籤（例如 v1.2.1，留空則僅產出 APK Artifact）"
        required: false
        default: ""

# Default to read-only. Grant write access only to the trusted Release job.
permissions:
  contents: read

jobs:
  test:
    name: 測試與網頁建置
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 語法與單元測試
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pip install pytest
            pytest -v
          else
            echo "執行 Python 語法檢查"
            python -m compileall -q -x "node_modules|dist|android|.git" .
          fi

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝依賴並建置前端 PWA
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          npm run lint
          npm run build

      - name: 上傳離線前端建置產物
        uses: actions/upload-artifact@v4
        with:
          name: droidpy-web-dist
          path: dist/

  build-apk:
    name: 打包 Android APK (ARM64)
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
      safe_tag: ${{ steps.resolve_tag.outputs.safe_tag }}
      artifact_name: ${{ steps.resolve_tag.outputs.artifact_name }}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載前端建置產物
        uses: actions/download-artifact@v4
        with:
          name: droidpy-web-dist
          path: dist

      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝依賴並產生 Android Gradle 專案與離線資源
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          rm -rf android
          npx tsx scripts/prepare-android.ts
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: 下載內嵌 Termux ARM64 Bootstrap
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL "https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip" \
            -o android/app/src/main/assets/bootstrap-aarch64.zip

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 設定 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 解析發佈版本與設定一致性 APK 簽名
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_KS_B64: ${{ secrets.DROIDPY_KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASS: ${{ secrets.DROIDPY_STORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.DROIDPY_KEY_ALIAS }}
          CUSTOM_KEY_PASS: ${{ secrets.DROIDPY_KEY_PASSWORD }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          INPUT_TAG="${INPUT_RELEASE_TAG:-}"
          if [ -n "$INPUT_TAG" ] && ! [[ "$INPUT_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag 必須是有效的版本標籤，例如 v1.2.3"
            exit 1
          fi
          VER=$(grep -m1 -oE '\[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md 2>/dev/null | tr -d '[' || true)
          if [ -z "$VER" ]; then
            VER="1.2.${GITHUB_RUN_NUMBER:-1}"
          fi

          IS_RELEASE_REF=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/master|refs/tags/v*) IS_RELEASE_REF=true ;;
            esac
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            IS_RELEASE_REF=true
          fi

          if [ "$IS_RELEASE_REF" != "true" ]; then
            rm -f android/app/droidpy-custom.keystore android/app/droidpy-debug.p12
            echo "Branch/PR/manual debug build uses Gradle ephemeral debug signer; no production key is loaded."
          elif [ -n "$CUSTOM_KS_B64" ]; then
            if [ -z "$CUSTOM_STORE_PASS" ] || [ -z "$CUSTOM_KEY_ALIAS" ] || [ -z "$CUSTOM_KEY_PASS" ]; then
              echo "::error::受保護的 signing secrets 缺少必要值。"
              exit 1
            fi
            printf '%s' "$CUSTOM_KS_B64" | base64 --decode > android/app/droidpy-custom.keystore
            echo "DROIDPY_KEYSTORE_FILE=droidpy-custom.keystore" >> "$GITHUB_ENV"
            printf 'DROIDPY_STORE_PASSWORD=%s\n' "$CUSTOM_STORE_PASS" >> "$GITHUB_ENV"
            printf 'DROIDPY_KEY_ALIAS=%s\n' "$CUSTOM_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'DROIDPY_KEY_PASSWORD=%s\n' "$CUSTOM_KEY_PASS" >> "$GITHUB_ENV"
            echo "使用受保護的 GitHub Actions signing secrets"
          else
            echo "::error::正式 Release 必須設定受保護的 DROIDPY_KEYSTORE_BASE64、DROIDPY_STORE_PASSWORD、DROIDPY_KEY_ALIAS 與 DROIDPY_KEY_PASSWORD。拒絕使用公開原始碼中的私鑰 fallback。"
            exit 1
          fi

          if [ -n "$INPUT_TAG" ]; then
            REL_TAG="v${INPUT_TAG#v}"
            VNAME="${REL_TAG#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REL_TAG="${GITHUB_REF_NAME}"
            VNAME="${REL_TAG#v}"
          else
            IFS='.' read -r MAJ MIN PAT <<< "$VER"
            MAJ=${MAJ:-1}
            MIN=${MIN:-2}
            PAT=${PAT:-0}
            for _ in $(seq 1 50); do
              CAND_TAG="v${MAJ}.${MIN}.${PAT}"
              if ! gh release view "$CAND_TAG" >/dev/null 2>&1; then
                REL_TAG="$CAND_TAG"
                break
              fi
              PAT=$((PAT + 1))
            done
            VNAME="${REL_TAG#v}"
          fi
          CODE=$(echo "$VNAME" | awk -F. '{print ($1*1000000)+($2*1000)+$3}')
          echo "DROIDPY_VERSION_NAME=$VNAME" >> "$GITHUB_ENV"
          echo "DROIDPY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "DROIDPY_RESOLVED_TAG=$REL_TAG" >> "$GITHUB_ENV"
      - name: 編譯 Debug APK (arm64-v8a)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 編譯正式 Release APK (arm64-v8a)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 強制驗證 APK 簽名與原憑證指紋
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_RELEASE_TAG" ]; then
            APK_DIR="android/app/build/outputs/apk/debug"
          else
            APK_DIR="android/app/build/outputs/apk/release"
          fi
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::預期恰好一個 APK，實際找到 ${#APK_FILES[@]} 個。"
            exit 1
          fi
          APK_PATH="${APK_FILES[0]}"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 Android apksigner，拒絕略過簽名驗證。"
            exit 1
          fi
          SIGNER_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1) || {
            echo "::error::APK 簽名驗證失敗。"
            printf '%s\n' "$SIGNER_OUTPUT"
            exit 1
          }
          printf '%s\n' "$SIGNER_OUTPUT"
          ACTUAL_SHA256=$(printf '%s\n' "$SIGNER_OUTPUT" | sed -nE 's/.*certificate SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/ip' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if ! [[ "$ACTUAL_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::無法從 apksigner 輸出取得有效的 SHA-256 憑證指紋。"
            exit 1
          fi
          EXPECTED_SHA256="29C549F02AB1781D42D94A6D80530EC8EF86670C82605F9255FDD95D5D545EBA"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK 簽名憑證與 DroidPy 原有憑證不一致，已阻止產物繼續發布。"
            echo "::error::無論使用內嵌金鑰或 GitHub Secrets，簽名指紋都必須保持不變。"
            exit 1
          fi
          echo "已確認 APK 使用 DroidPy 原有簽名憑證（SHA-256: $ACTUAL_SHA256）。"

      - name: 整理發佈版本與 APK 檔名
        id: resolve_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-apk
          IS_RELEASE_REF=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/master|refs/tags/v*) IS_RELEASE_REF=true ;;
            esac
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_RELEASE_TAG" ]; then
            IS_RELEASE_REF=true
          fi
          if [ "$IS_RELEASE_REF" != "true" ]; then
            REL_TAG="debug-${GITHUB_RUN_NUMBER}"
            SAFE_TAG="$REL_TAG"
            ART_NAME="DroidPy-arm64-debug-${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT:-1}"
            cp android/app/build/outputs/apk/debug/*.apk "release-apk/DroidPy-arm64-debug-${GITHUB_RUN_NUMBER}.apk"
          else
            REL_TAG="${DROIDPY_RESOLVED_TAG}"
            SAFE_TAG="${REL_TAG//\//-}"
            ART_NAME="DroidPy-arm64-apk-${SAFE_TAG}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT:-1}"
            cp android/app/build/outputs/apk/release/*.apk "release-apk/DroidPy-arm64-${SAFE_TAG}.apk"
          fi
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ART_NAME}" >> "$GITHUB_OUTPUT"
      - name: 上傳保留版本 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_tag.outputs.artifact_name }}
          path: release-apk/*.apk
          retention-days: 90
          overwrite: true

  release:
    name: 建立 GitHub Release（保留歷史版本 APK）
    needs: build-apk
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 下載 APK 建置產物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact_name }}
          path: release-apk

      - name: 發布 GitHub Release 並保留所有歷史版本 APK
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ needs.build-apk.outputs.release_tag }}
          SAFE_TAG: ${{ needs.build-apk.outputs.safe_tag }}
        run: |
          APK_FILE=$(ls release-apk/*.apk | head -n1)
          APK_BASE=$(basename "$APK_FILE")

          # 產生包含歷史版本 APK 下載清單的發佈說明（不刪除既有歷史 Release 與 APK）
          {
            if [ -f CHANGELOG.md ]; then
              cat CHANGELOG.md
            else
              echo "# DroidPy ${REL_TAG}"
            fi
            echo ""
            echo "---"
            echo "## 歷史版本 APK 下載清單 (Historical Releases)"
            echo ""
            echo "所有歷史版本 Release 與對應簽名一致之 ARM64 APK 皆永久保留於此清單，可直接點擊下載回溯："
            echo ""
            HIST_LIST=$(gh release list --limit 30 --json tagName,publishedAt --jq '.[] | "- [\(.tagName)](https://github.com/'"${GITHUB_REPOSITORY}"'/releases/tag/\(.tagName)) · [下載 DroidPy-arm64-\(.tagName).apk](https://github.com/'"${GITHUB_REPOSITORY}"'/releases/download/\(.tagName)/DroidPy-arm64-\(.tagName).apk) (\(.publishedAt | split("T")[0]))"' 2>/dev/null || true)
            if [ -n "$HIST_LIST" ]; then
              echo "$HIST_LIST"
            else
              echo "- [${REL_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${REL_TAG}) · [下載 ${APK_BASE}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${REL_TAG}/${APK_BASE})"
            fi
          } > RELEASE_NOTES.md

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$APK_FILE" --clobber
            gh release edit "$REL_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$REL_TAG" "$APK_FILE" \
              --title "DroidPy ${REL_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --target "${GITHUB_SHA}" || {
                gh release upload "$REL_TAG" "$APK_FILE" --clobber
                gh release edit "$REL_TAG" --notes-file RELEASE_NOTES.md
              }
          fi
