name: DroidPy CI / APK / Release

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "選填：手動發布 GitHub Release 標籤（例如 v1.2.1，留空則僅產出 APK Artifact）"
        required: false
        default: ""

# Default to read-only. Grant write access only to the trusted Release job.
permissions:
  contents: read

jobs:
  test:
    name: 測試與網頁建置
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python 語法與單元測試
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -d tests ] || ls test_*.py *_test.py 1> /dev/null 2>&1; then
            pip install pytest
            pytest -v
          else
            echo "執行 Python 語法檢查"
            python -m compileall -q -x "node_modules|dist|android|.git" .
          fi

      - name: 設定 Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: 安裝依賴並建置前端 PWA
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          npm run lint
          npm run check:bridge
          npm run check:script-backup
          npm run check:apk-updater
          npm run check:export-workflow
          npm run check:watchdog-safety
          npm run check:probe-url-security
          npm run check:package-inventory
          npm run check:apt-security
          npm run build

      - name: 上傳離線前端建置產物
        uses: actions/upload-artifact@v4
        with:
          name: droidpy-web-dist
          path: dist/

  build-apk:
    name: 打包 Android APK (ARM64)
    needs: test
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.release_tag }}
      safe_tag: ${{ steps.resolve_tag.outputs.safe_tag }}
      artifact_name: ${{ steps.resolve_tag.outputs.artifact_name }}
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 下載前端建置產物
        uses: actions/download-artifact@v4
        with:
          name: droidpy-web-dist
          path: dist

      - name: 設定 Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: 安裝依賴並產生 Android Gradle 專案與離線資源
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          rm -rf android
          npx tsx scripts/prepare-android.ts
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: 下載內嵌 Termux ARM64 Bootstrap
        run: |
          mkdir -p android/app/src/main/assets
          curl -fL "https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip" \
            -o android/app/src/main/assets/bootstrap-aarch64.zip

      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 設定 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 解析發佈版本與設定一致性 APK 簽名
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_KS_B64: ${{ secrets.DROIDPY_KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASS: ${{ secrets.DROIDPY_STORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.DROIDPY_KEY_ALIAS }}
          CUSTOM_KEY_PASS: ${{ secrets.DROIDPY_KEY_PASSWORD }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          INPUT_TAG="${INPUT_RELEASE_TAG:-}"
          if [ -n "$INPUT_TAG" ] && ! [[ "$INPUT_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_tag 必須是有效的版本標籤，例如 v1.2.3"
            exit 1
          fi
          VER=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md 2>/dev/null | head -n1 || true)
          if [ -z "$VER" ]; then
            VER="1.2.${GITHUB_RUN_NUMBER:-1}"
          fi

          IS_RELEASE_REF=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/master|refs/tags/v*) IS_RELEASE_REF=true ;;
            esac
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            IS_RELEASE_REF=true
          fi
          echo "DROIDPY_RELEASE_BUILD=$IS_RELEASE_REF" >> "$GITHUB_ENV"

          # Same-repository PRs may use the protected signing key for stable Beta updates.
          # Fork PRs never receive signing secrets. Release builds always require the key.
          USE_SIGNING_KEY="$IS_RELEASE_REF"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${PR_HEAD_REPO:-}" = "${CURRENT_REPO:-}" ]; then
            if [ -n "$CUSTOM_KS_B64" ] && [ -n "$CUSTOM_STORE_PASS" ] && [ -n "$CUSTOM_KEY_ALIAS" ] && [ -n "$CUSTOM_KEY_PASS" ]; then
              USE_SIGNING_KEY=true
            fi
          fi
          if [ "$USE_SIGNING_KEY" = "true" ]; then
            for secret_name in CUSTOM_KS_B64 CUSTOM_STORE_PASS CUSTOM_KEY_ALIAS CUSTOM_KEY_PASS; do
              if [ -z "${!secret_name}" ]; then
                if [ "$IS_RELEASE_REF" = "true" ]; then
                  echo "::error::正式發布缺少必要的 GitHub Actions Secret：$secret_name（請確認四項 Secret 均已建立且名稱完全一致）。"
                  exit 1
                fi
                USE_SIGNING_KEY=false
                break
              fi
            done
          fi
          if [ "$USE_SIGNING_KEY" = "true" ]; then
            # Normalize pasted line breaks/spaces before decoding the one-line Base64 file.
            CUSTOM_KS_B64_CLEAN=$(printf '%s' "$CUSTOM_KS_B64" | tr -d '[:space:]')
            if ! printf '%s' "$CUSTOM_KS_B64_CLEAN" | base64 --decode > android/app/droidpy-release.keystore 2>base64-error.txt; then
              echo "::error::DROIDPY_KEYSTORE_BASE64 無法解碼；請將 DROIDPY_KEYSTORE_BASE64.txt 全文原樣填入，不要加引號或其他文字。"
              exit 1
            fi
            if [ ! -s android/app/droidpy-release.keystore ]; then
              echo "::error::解碼後的金鑰庫是空檔案，請重新確認 DROIDPY_KEYSTORE_BASE64。"
              exit 1
            fi
            KEYSTORE_BYTES=$(wc -c < android/app/droidpy-release.keystore | tr -d ' ')
            echo "已解碼正式簽名金鑰庫：${KEYSTORE_BYTES} bytes（不輸出任何 Secret）"
            EXPECTED_KEYSTORE_FILE_SHA256="3903E150AEA971525F4912C67FFAE57F0E18E85759456C78A349C7C78B35B280"
            ACTUAL_KEYSTORE_FILE_SHA256=$(sha256sum android/app/droidpy-release.keystore | awk '{print toupper($1)}')
            if [ "$ACTUAL_KEYSTORE_FILE_SHA256" != "$EXPECTED_KEYSTORE_FILE_SHA256" ]; then
              echo "::error::GitHub Secret 解碼後的金鑰庫內容與原始離線金鑰套件不一致。請只重新核對 DROIDPY_KEYSTORE_BASE64。"
              echo "::error::實際檔案 SHA-256：$ACTUAL_KEYSTORE_FILE_SHA256"
              exit 1
            fi
            echo "已確認解碼後金鑰庫與原始離線套件逐位元一致。"
            if ! keytool -list -keystore android/app/droidpy-release.keystore -storepass "$CUSTOM_STORE_PASS" -alias "$CUSTOM_KEY_ALIAS" >/dev/null 2>keytool-list-error.txt; then
              if grep -Eqi 'password was incorrect|keystore was tampered|failed to decrypt|keystore password.*incorrect' keytool-list-error.txt; then
                echo "::error::金鑰庫密碼驗證失敗：請確認 DROIDPY_STORE_PASSWORD。"
              elif grep -Eqi 'alias .* does not exist|does not contain alias|alias .* not found' keytool-list-error.txt; then
                echo "::error::找不到指定金鑰別名：請確認 DROIDPY_KEY_ALIAS 是否為 droidpy-release。"
              else
                echo "::error::PKCS12 金鑰庫載入失敗，以下為 keytool 診斷（不含密碼）："
                if [ -s keytool-list-error.txt ]; then
                  sed -n '1,8p' keytool-list-error.txt
                else
                  echo "::error::keytool 未輸出 stderr；將改用合併輸出診斷。"
                  if keytool -list -keystore android/app/droidpy-release.keystore -storepass "$CUSTOM_STORE_PASS" -alias "$CUSTOM_KEY_ALIAS" >keytool-list-output.txt 2>&1; then
                    echo "第二次 keytool 載入成功；第一次錯誤可能為暫時性。"
                  else
                    sed -n '1,12p' keytool-list-output.txt
                  fi
                fi
              fi
              exit 1
            fi
            echo "DROIDPY_KEYSTORE_FILE=droidpy-release.keystore" >> "$GITHUB_ENV"
            printf 'DROIDPY_STORE_PASSWORD=%s\n' "$CUSTOM_STORE_PASS" >> "$GITHUB_ENV"
            printf 'DROIDPY_KEY_ALIAS=%s\n' "$CUSTOM_KEY_ALIAS" >> "$GITHUB_ENV"
            printf 'DROIDPY_KEY_PASSWORD=%s\n' "$CUSTOM_KEY_PASS" >> "$GITHUB_ENV"
            set -o pipefail
            if ! KEYSTORE_SHA256=$(keytool -exportcert -keystore android/app/droidpy-release.keystore -storepass "$CUSTOM_STORE_PASS" -alias "$CUSTOM_KEY_ALIAS" 2>keytool-export-error.txt | sha256sum | awk '{print toupper($1)}') || [ -z "$KEYSTORE_SHA256" ]; then
              echo "::error::無法從金鑰庫匯出憑證指紋；keytool 診斷如下："
              sed -n '1,8p' keytool-export-error.txt
              exit 1
            fi
            EXPECTED_RELEASE_CERT_SHA256="353F581792A659420EAF1E8EC278E7F5F78C8B13F767EA0A9E3DDEA682AEB818"
            if [ "$KEYSTORE_SHA256" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
              echo "::error::載入的 keystore 憑證指紋與預期的新 DroidPy 金鑰不符；請確認 Base64 Secret 來自正確的 DROIDPY_KEYSTORE_BASE64.txt。"
              echo "::error::實際指紋：$KEYSTORE_SHA256"
              exit 1
            fi
            echo "DROIDPY_EXPECTED_CERT_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"
            if [ "$IS_RELEASE_REF" = "true" ]; then
              echo "已驗證新的 DroidPy Release 憑證：$KEYSTORE_SHA256"
            else
              echo "已驗證 Beta 使用受保護的穩定 DroidPy 簽名憑證：$KEYSTORE_SHA256"
            fi
          else
            if [ "$IS_RELEASE_REF" = "true" ]; then
              echo "::error::正式 Release 不可使用臨時 Debug 簽名。"
              exit 1
            fi
            echo "非可信任 PR／Fork 使用臨時 Debug 簽名；同一來源的 Beta 更新請保持來源可信任。"
          fi
          if [ -n "$INPUT_TAG" ]; then
            REL_TAG="v${INPUT_TAG#v}"
            VNAME="${REL_TAG#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REL_TAG="${GITHUB_REF_NAME}"
            VNAME="${REL_TAG#v}"
          else
            IFS='.' read -r MAJ MIN PAT <<< "$VER"
            MAJ=${MAJ:-1}
            MIN=${MIN:-2}
            PAT=${PAT:-0}
            for _ in $(seq 1 50); do
              CAND_TAG="v${MAJ}.${MIN}.${PAT}"
              if ! gh release view "$CAND_TAG" >/dev/null 2>&1; then
                REL_TAG="$CAND_TAG"
                break
              fi
              PAT=$((PAT + 1))
            done
            VNAME="${REL_TAG#v}"
          fi
          if [ "$IS_RELEASE_REF" != "true" ]; then VNAME="${REL_TAG#v}-Beta"; fi
          CODE_VERSION="${VNAME%%-*}"
          CODE=$(echo "$CODE_VERSION" | awk -F. '{print ($1*1000000)+($2*1000)+$3}')
          echo "DROIDPY_VERSION_NAME=$VNAME" >> "$GITHUB_ENV"
          echo "DROIDPY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "DROIDPY_RESOLVED_TAG=$REL_TAG" >> "$GITHUB_ENV"
      - name: 編譯 Debug APK (arm64-v8a)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 編譯正式 Release APK (arm64-v8a)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 驗證 APK 簽名（正式版比對新金鑰）
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${DROIDPY_RELEASE_BUILD:-false}" = "true" ]; then
            APK_DIR="android/app/build/outputs/apk/release"
          else
            APK_DIR="android/app/build/outputs/apk/debug"
          fi
          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::預期恰好一個 APK，實際找到 ${#APK_FILES[@]} 個。"
            exit 1
          fi
          APK_PATH="${APK_FILES[0]}"
          if [ "${DROIDPY_RELEASE_BUILD:-false}" != "true" ]; then
            AAPT=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)
            if [ -z "$AAPT" ]; then
              echo "::error::找不到 Android aapt，無法驗證 Beta APK 套件名稱。"
              exit 1
            fi
            APK_PACKAGE=$("$AAPT" dump badging "$APK_PATH" | sed -n "s/^package: name=\x27\([^\x27]*\)\x27.*/\1/p" | head -n1)
            case "$APK_PACKAGE" in
              *.beta) echo "已確認測試版使用獨立套件 ID：$APK_PACKAGE" ;;
              *) echo "::error::測試版套件 ID 未以 .beta 結尾：$APK_PACKAGE"; exit 1 ;;
            esac
          fi
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::找不到 Android apksigner，拒絕略過簽名驗證。"
            exit 1
          fi
          SIGNER_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH" 2>&1) || {
            echo "::error::APK 簽名驗證失敗。"
            printf '%s\n' "$SIGNER_OUTPUT"
            exit 1
          }
          printf '%s\n' "$SIGNER_OUTPUT"
          ACTUAL_SHA256=$(printf '%s\n' "$SIGNER_OUTPUT" | sed -nE 's/.*certificate SHA-256 digest: *([0-9A-Fa-f:]+).*/\1/ip' | head -n1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if ! [[ "$ACTUAL_SHA256" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::無法從 apksigner 輸出取得有效的 SHA-256 憑證指紋。"
            exit 1
          fi
          if [ "${DROIDPY_RELEASE_BUILD:-false}" = "true" ]; then
            EXPECTED_SHA256="${DROIDPY_EXPECTED_CERT_SHA256:-}"
            if ! [[ "$EXPECTED_SHA256" =~ ^[0-9A-F]{64}$ ]] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Release APK 與本次受保護的新 keystore 憑證不一致，已阻止發布。"
              exit 1
            fi
            echo "已確認 Release APK 使用本次受保護的新簽名憑證（SHA-256: $ACTUAL_SHA256）。"
          else
            if [ -n "${DROIDPY_EXPECTED_CERT_SHA256:-}" ]; then
              if [ "$ACTUAL_SHA256" != "$DROIDPY_EXPECTED_CERT_SHA256" ]; then
                echo "::error::Beta APK 簽名與受保護的穩定憑證不一致，拒絕產出可更新測試版。"
                exit 1
              fi
              echo "已確認 Beta APK 使用穩定 DroidPy 憑證（SHA-256: $ACTUAL_SHA256）。"
            else
              echo "已確認 PR Debug APK 簽名結構有效（臨時憑證 SHA-256: $ACTUAL_SHA256）。"
            fi
          fi

      - name: 整理發佈版本與 APK 檔名
        id: resolve_tag
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p release-apk
          IS_RELEASE_REF=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/master|refs/tags/v*) IS_RELEASE_REF=true ;;
            esac
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_RELEASE_TAG" ]; then
            IS_RELEASE_REF=true
          fi
          if [ "$IS_RELEASE_REF" != "true" ]; then
            REL_TAG="debug-${GITHUB_RUN_NUMBER}"
            SAFE_TAG="$REL_TAG"
            ART_NAME="DroidPy-arm64-debug-${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT:-1}"
            cp android/app/build/outputs/apk/debug/*.apk "release-apk/DroidPy-arm64-${DROIDPY_VERSION_NAME}.apk"
          else
            REL_TAG="${DROIDPY_RESOLVED_TAG}"
            SAFE_TAG="${REL_TAG//\//-}"
            ART_NAME="DroidPy-arm64-apk-${SAFE_TAG}-r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT:-1}"
            cp android/app/build/outputs/apk/release/*.apk "release-apk/DroidPy-arm64-${SAFE_TAG}.apk"
          fi
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "safe_tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ART_NAME}" >> "$GITHUB_OUTPUT"
      - name: 上傳保留版本 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_tag.outputs.artifact_name }}
          path: release-apk/*.apk
          retention-days: 90
          overwrite: true

  release:
    name: 建立 GitHub Release（保留歷史版本 APK）
    needs: build-apk
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v5

      - name: 下載 APK 建置產物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact_name }}
          path: release-apk

      - name: 發布 GitHub Release 並保留所有歷史版本 APK
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ needs.build-apk.outputs.release_tag }}
          SAFE_TAG: ${{ needs.build-apk.outputs.safe_tag }}
        run: |
          APK_FILE=$(ls release-apk/*.apk | head -n1)
          APK_BASE=$(basename "$APK_FILE")

          # 產生包含歷史版本 APK 下載清單的發佈說明（不刪除既有歷史 Release 與 APK）
          {
            if [ -f CHANGELOG.md ]; then
              cat CHANGELOG.md
            else
              echo "# DroidPy ${REL_TAG}"
            fi
            echo ""
            echo "---"
            echo "## 歷史版本 APK 下載清單 (Historical Releases)"
            echo ""
            echo "所有歷史版本 Release 與對應簽名一致之 ARM64 APK 皆永久保留於此清單，可直接點擊下載回溯："
            echo ""
            HIST_LIST=$(gh release list --limit 30 --json tagName,publishedAt --jq '.[] | "- [\(.tagName)](https://github.com/'"${GITHUB_REPOSITORY}"'/releases/tag/\(.tagName)) · [下載 DroidPy-arm64-\(.tagName).apk](https://github.com/'"${GITHUB_REPOSITORY}"'/releases/download/\(.tagName)/DroidPy-arm64-\(.tagName).apk) (\(.publishedAt | split("T")[0]))"' 2>/dev/null || true)
            if [ -n "$HIST_LIST" ]; then
              echo "$HIST_LIST"
            else
              echo "- [${REL_TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${REL_TAG}) · [下載 ${APK_BASE}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${REL_TAG}/${APK_BASE})"
            fi
          } > RELEASE_NOTES.md

          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" "$APK_FILE" --clobber
            gh release edit "$REL_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$REL_TAG" "$APK_FILE" \
              --title "DroidPy ${REL_TAG}" \
              --notes-file RELEASE_NOTES.md \
              --target "${GITHUB_SHA}" || {
                gh release upload "$REL_TAG" "$APK_FILE" --clobber
                gh release edit "$REL_TAG" --notes-file RELEASE_NOTES.md
              }
          fi
